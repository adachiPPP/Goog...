<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>goog</title>
  <link rel="icon" type="image/jpeg" href="goog.jpg">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="controls">
    <a href="https://adachi.potatochip.workers.dev/" class="btn">homepage</a>
    <button id="addBtn">+ goog</button>
    <button id="jumpBtn">jump all</button>
    <button id="toggleJumpBtn">jumping: on</button>
    <button id="clearBtn">clear</button>
  </div>

  <script>
    const googs = [];
    const gravity = 0.55;
    const bounce = 0.82;
    const friction = 0.992;
    const spawnGrabCooldown = 250;
    const maxSpeed = 32;
    let jumpingEnabled = true;
    let activeDrag = null;
    let dragOffsetX = 0;
    let dragOffsetY = 0;
    let lastMouseX = 0;
    let lastMouseY = 0;
    let pointerX = window.innerWidth / 2;
    let pointerY = window.innerHeight / 3;
    let dragVelX = 0;
    let dragVelY = 0;
    let lastMeowTime = 0;

    function playMeow(impactSpeed = 10) {
      const now = performance.now();
      if (now - lastMeowTime < 90) return;
      lastMeowTime = now;

      const audio = new Audio('meow.mp3');
      audio.volume = Math.min(1, Math.max(0.2, impactSpeed / 22));
      audio.playbackRate = 0.88 + Math.random() * 0.28;
      audio.play().catch(() => {});
    }

    function createGoog(x, y) {
      const el = document.createElement('img');
      el.src = 'goog.jpg';
      el.className = 'goog';
      el.draggable = false;

      const size = Math.floor(Math.random() * 60) + 80;
      el.style.width = size + 'px';
      el.style.height = size + 'px';

      const goog = {
        el,
        size,
        mass: size * size,
        x: x !== undefined ? x - size / 2 : Math.random() * (window.innerWidth - size),
        y: y !== undefined ? y - size / 2 : Math.random() * (window.innerHeight * 0.5),
        vx: (Math.random() - 0.5) * 14,
        vy: (Math.random() - 0.5) * 8 - 4,
        rot: (Math.random() - 0.5) * 30,
        vrot: (Math.random() - 0.5) * 6,
        isDragging: false,
        spawnTime: performance.now()
      };

      document.body.appendChild(el);
      googs.push(goog);
    }

    function getGoogAt(clientX, clientY, pad = 12, ignoreRecent = false) {
      const now = performance.now();
      for (let i = googs.length - 1; i >= 0; i--) {
        const g = googs[i];
        if (ignoreRecent && now - g.spawnTime < spawnGrabCooldown) continue;
        if (
          clientX >= g.x - pad &&
          clientX <= g.x + g.size + pad &&
          clientY >= g.y - pad &&
          clientY <= g.y + g.size + pad
        ) {
          return g;
        }
      }
      return null;
    }

    function startDrag(goog, clientX, clientY) {
      activeDrag = goog;
      goog.isDragging = true;
      goog.vx = 0;
      goog.vy = 0;
      goog.vrot = 0;
      dragOffsetX = clientX - goog.x;
      dragOffsetY = clientY - goog.y;
      lastMouseX = clientX;
      lastMouseY = clientY;
      dragVelX = 0;
      dragVelY = 0;
      goog.el.classList.add('dragging');
      document.body.appendChild(goog.el);
    }

    window.addEventListener('pointerdown', (e) => {
      pointerX = e.clientX;
      pointerY = e.clientY;
      if (e.target.closest('.controls')) return;

      const hit = getGoogAt(e.clientX, e.clientY, 12, true);
      if (hit) {
        startDrag(hit, e.clientX, e.clientY);
        return;
      }

      createGoog(e.clientX, e.clientY);
    });

    window.addEventListener('pointermove', (e) => {
      pointerX = e.clientX;
      pointerY = e.clientY;
      if (!activeDrag) return;
      dragVelX = e.clientX - lastMouseX;
      dragVelY = e.clientY - lastMouseY;
      lastMouseX = e.clientX;
      lastMouseY = e.clientY;
      activeDrag.x = e.clientX - dragOffsetX;
      activeDrag.y = e.clientY - dragOffsetY;
      activeDrag.vx = dragVelX;
      activeDrag.vy = dragVelY;
    });

    function endDrag() {
      if (!activeDrag) return;
      activeDrag.isDragging = false;
      activeDrag.el.classList.remove('dragging');
      activeDrag.vx = Math.max(-maxSpeed, Math.min(maxSpeed, dragVelX * 1.2));
      activeDrag.vy = Math.max(-maxSpeed, Math.min(maxSpeed, dragVelY * 1.2));
      activeDrag.vrot = dragVelX * 0.5;
      activeDrag = null;
    }

    window.addEventListener('pointerup', endDrag);
    window.addEventListener('pointercancel', endDrag);

    window.addEventListener('keydown', (e) => {
      if (e.code === 'Space') {
        e.preventDefault();
        createGoog(pointerX, pointerY);
      }
    });

    window.addEventListener('wheel', (e) => {
      const target = activeDrag || getGoogAt(e.clientX, e.clientY, 0, false);
      if (!target) return;

      e.preventDefault();

      const oldSize = target.size;
      const step = e.deltaY < 0 ? 14 : -14;
      const newSize = Math.max(30, Math.min(450, oldSize + step));
      const diff = newSize - oldSize;

      target.size = newSize;
      target.mass = newSize * newSize;
      target.x -= diff / 2;
      target.y -= diff / 2;
      target.el.style.width = newSize + 'px';
      target.el.style.height = newSize + 'px';

      if (activeDrag === target) {
        dragOffsetX += diff / 2;
        dragOffsetY += diff / 2;
      }
    }, { passive: false });

    function clampBounds(g, w, h) {
      if (g.x < 0) {
        g.x = 0;
        if (g.vx < 0) g.vx = Math.abs(g.vx) * (jumpingEnabled ? bounce : 0.2);
      } else if (g.x + g.size > w) {
        g.x = w - g.size;
        if (g.vx > 0) g.vx = -Math.abs(g.vx) * (jumpingEnabled ? bounce : 0.2);
      }

      if (g.y < 0) {
        g.y = 0;
        if (g.vy < 0) g.vy = Math.abs(g.vy) * (jumpingEnabled ? bounce : 0.2);
      } else if (g.y + g.size > h) {
        g.y = h - g.size;
        if (g.vy > 3.5) {
          playMeow(g.vy);
        }
        if (jumpingEnabled) {
          const jumpForce = Math.random() * 14 + 10;
          g.vy = -Math.max(Math.abs(g.vy) * bounce, jumpForce);
          g.vx += (Math.random() - 0.5) * 8;
          g.vrot = (Math.random() - 0.5) * 14;
        } else {
          if (g.vy > 2.5) {
            g.vy = -g.vy * 0.25;
            g.vx *= 0.85;
            g.vrot *= 0.6;
          } else {
            g.vy = 0;
            g.vx *= 0.88;
            g.vrot *= 0.8;
            if (Math.abs(g.vx) < 0.08) g.vx = 0;
            if (Math.abs(g.vrot) < 0.08) g.vrot = 0;
          }
        }
      }
    }

    function resolveCollisions(w, h) {
      const iterations = jumpingEnabled ? 4 : 8;

      for (let iter = 0; iter < iterations; iter++) {
        for (let i = 0; i < googs.length; i++) {
          const a = googs[i];
          const r1 = a.size * 0.45;
          const cx1 = a.x + a.size * 0.5;
          const cy1 = a.y + a.size * 0.5;

          for (let j = i + 1; j < googs.length; j++) {
            const b = googs[j];
            const r2 = b.size * 0.45;
            const cx2 = b.x + b.size * 0.5;
            const cy2 = b.y + b.size * 0.5;

            let dx = cx2 - cx1;
            let dy = cy2 - cy1;
            let dist = Math.hypot(dx, dy);
            const minDist = r1 + r2;

            if (dist < minDist) {
              if (dist === 0) {
                dx = (Math.random() - 0.5) || 1;
                dy = -1;
                dist = Math.hypot(dx, dy);
              }

              const nx = dx / dist;
              const ny = dy / dist;
              const overlap = (minDist - dist) * 0.8;

              const totalMass = a.mass + b.mass;
              const ratioA = b.mass / totalMass;
              const ratioB = a.mass / totalMass;

              if (a.isDragging && !b.isDragging) {
                b.x += nx * overlap;
                b.y += ny * overlap;
              } else if (b.isDragging && !a.isDragging) {
                a.x -= nx * overlap;
                a.y -= ny * overlap;
              } else if (!a.isDragging && !b.isDragging) {
                a.x -= nx * overlap * ratioA;
                a.y -= ny * overlap * ratioA;
                b.x += nx * overlap * ratioB;
                b.y += ny * overlap * ratioB;
              }

              const rvx = b.vx - a.vx;
              const rvy = b.vy - a.vy;
              const velAlongNormal = rvx * nx + rvy * ny;

              if (velAlongNormal < 0) {
                if (iter === 0 && velAlongNormal < -8) {
                  playMeow(-velAlongNormal);
                }
                const restitution = !jumpingEnabled && Math.abs(velAlongNormal) < 2.5 ? 0 : (jumpingEnabled ? 0.72 : 0.15);
                const impulse = (-(1 + restitution) * velAlongNormal) / (1 / a.mass + 1 / b.mass);
                const impulseX = impulse * nx;
                const impulseY = impulse * ny;

                if (!a.isDragging) {
                  a.vx -= impulseX / a.mass;
                  a.vy -= impulseY / a.mass;
                  a.vrot += (nx * rvy - ny * rvx) * 0.02;
                }
                if (!b.isDragging) {
                  b.vx += impulseX / b.mass;
                  b.vy += impulseY / b.mass;
                  b.vrot -= (nx * rvy - ny * rvx) * 0.02;
                }
              }
            }
          }

          if (!a.isDragging) {
            clampBounds(a, w, h);
          }
        }
      }
    }

    function update() {
      const w = window.innerWidth;
      const h = window.innerHeight;

      for (let i = 0; i < googs.length; i++) {
        const g = googs[i];

        if (!g.isDragging) {
          g.vy += gravity;
          g.vx *= friction;
          if (!jumpingEnabled) {
            g.vx *= 0.96;
            g.vy *= 0.98;
            g.vrot *= 0.92;
          }

          g.vx = Math.max(-maxSpeed, Math.min(maxSpeed, g.vx));
          g.vy = Math.max(-maxSpeed, Math.min(maxSpeed, g.vy));
          g.vrot = Math.max(-18, Math.min(18, g.vrot));

          g.x += g.vx;
          g.y += g.vy;
          g.rot += g.vrot;
        }
      }

      resolveCollisions(w, h);

      for (let i = 0; i < googs.length; i++) {
        const g = googs[i];
        g.el.style.transform = `translate3d(${g.x}px, ${g.y}px, 0) rotate(${g.rot}deg)`;
      }

      requestAnimationFrame(update);
    }

    document.getElementById('addBtn').addEventListener('click', () => {
      createGoog();
    });

    document.getElementById('jumpBtn').addEventListener('click', () => {
      for (const g of googs) {
        if (!g.isDragging) {
          g.vy = -(Math.random() * 18 + 14);
          g.vx += (Math.random() - 0.5) * 18;
          g.vrot = (Math.random() - 0.5) * 25;
        }
      }
    });

    document.getElementById('toggleJumpBtn').addEventListener('click', (e) => {
      jumpingEnabled = !jumpingEnabled;
      e.target.textContent = jumpingEnabled ? 'jumping: on' : 'jumping: off';
      if (jumpingEnabled) {
        for (const g of googs) {
          if (!g.isDragging) {
            g.vy = -(Math.random() * 10 + 8);
            g.vx = (Math.random() - 0.5) * 12;
            g.vrot = (Math.random() - 0.5) * 10;
          }
        }
      }
    });

    document.getElementById('clearBtn').addEventListener('click', () => {
      for (const g of googs) {
        g.el.remove();
      }
      googs.length = 0;
      createGoog();
    });

    for (let i = 0; i < 6; i++) {
      createGoog();
    }

    requestAnimationFrame(update);
  </script>
</body>
</html>
